<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0a; overflow: hidden; }
  .frame { position: absolute; inset: 0; overflow: hidden; }
  img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; will-change: transform; }
  /* Nine seconds of one slow, eased camera move. */
  .go img { transition: transform 9s cubic-bezier(.45, .05, .35, 1), object-position 9s cubic-bezier(.45, .05, .35, 1); }
  /* Moves stay inside the frame's crop, so the logo and headline never leave. */
  .pan-x img { object-position: 0% 0%; transform-origin: 50% 0%; transform: scale(1); }
  .go .pan-x img { object-position: 100% 0%; transform: scale(1.04); }
  .pan-y img { object-position: 0% 0%; transform-origin: 0% 0%; transform: scale(1); }
  .go .pan-y img { object-position: 0% 100%; transform: scale(1.05); }
  /* A page scrolled from its header down to what is below: full width, native size. */
  .scroll-y img { width: auto; height: auto; max-width: none; inset: 0 auto auto 50%; object-fit: none; transform: translate(-50%, 0); }
  .go .scroll-y img { transform: translate(-50%, calc(100vh - 100%)); }
  .push img { object-position: 0% 50%; transform-origin: 8% 22%; transform: scale(1); }
  .go .push img { transform: scale(1.14); }
</style>
</head>
<body>
<div class="frame"><img alt=""></div>
<script>
  const q = new URLSearchParams(location.search)
  document.querySelector('.frame').classList.add(q.get('move'))
  document.querySelector('img').src = q.get('img')
</script>
</body>
</html>
