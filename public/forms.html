<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Form definitions</title>
    <meta name="robots" content="noindex, nofollow" />
  </head>
  <body>
    <!--
      Netlify detects forms by scanning deployed HTML at build time. On an SSR
      site most pages are rendered per request, so there is nothing to scan.
      This static file is the documented workaround: it declares the form's
      shape so Netlify provisions the endpoint, and the real Vue form posts
      here over fetch.

      Every field name below must match the real form in
      components/ContactSection.vue.
    -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
